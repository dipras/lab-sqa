<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lab Penjaminan Mutu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: lab notebook — week rail on the left, one lab sheet per week on the right (concept → bench → test run); rail becomes a tab strip on phones */
:root{
  --bg:#EDF0EB; --surface:#FFFFFF; --sunk:#E2E7E0; --ink:#16201B; --muted:#56635C; --line:#CAD3C9; --grid:rgba(36,67,201,.055);
  --accent:#2443C9; --accent-ink:#FFFFFF; --accent-soft:#DDE4FB;
  --pass:#1C7C45; --pass-soft:#D5ECDD; --fail:#BA3826; --fail-soft:#F5DBD5; --warn:#9C6410; --warn-soft:#F3E5C9;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1412; --surface:#161D1A; --sunk:#1E2723; --ink:#E3EAE5; --muted:#94A29A; --line:#2C3833; --grid:rgba(143,163,255,.05);
  --accent:#8FA3FF; --accent-ink:#0F1412; --accent-soft:#222B52;
  --pass:#55C686; --pass-soft:#163122; --fail:#F2725E; --fail-soft:#3C1C16; --warn:#E2A94F; --warn-soft:#382A13; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1412; --surface:#161D1A; --sunk:#1E2723; --ink:#E3EAE5; --muted:#94A29A; --line:#2C3833; --grid:rgba(143,163,255,.05);
  --accent:#8FA3FF; --accent-ink:#0F1412; --accent-soft:#222B52;
  --pass:#55C686; --pass-soft:#163122; --fail:#F2725E; --fail-soft:#3C1C16; --warn:#E2A94F; --warn-soft:#382A13; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.15;margin:0}
h1{font-size:clamp(1.9rem,4.2vw,2.8rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.1rem;font-weight:500}
p{margin:0}
code,.mono{font-family:var(--f-mono)}
code{font-size:.88em;background:var(--sunk);padding:.08em .35em;border-radius:4px}
.mono{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:16px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;color:inherit;background:none;border:0;padding:0}
.brand b{font-family:var(--f-display);font-size:1.15rem}
.brand .mono{color:var(--muted)}
.suite{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.suite-bar{display:flex;gap:3px}
.suite-bar i{width:14px;height:8px;border-radius:2px;background:var(--sunk);border:1px solid var(--line)}
.suite-bar i.ok{background:var(--pass);border-color:var(--pass)}
.suite-bar i.try{background:var(--warn);border-color:var(--warn)}

/* frame */
.frame{max-width:1200px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:230px minmax(0,1fr);gap:36px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;display:flex;flex-direction:column;gap:2px}
.rail .mono{color:var(--muted);padding:0 10px 8px}
.rail button{display:grid;grid-template-columns:34px 1fr auto;gap:6px;align-items:center;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:8px 10px;font-size:.92rem;line-height:1.3}
.rail button:hover{background:var(--surface);border-color:var(--line)}
.rail button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.rail button .wk{font-family:var(--f-mono);font-size:.75rem;opacity:.8}
.rail .dot{width:8px;height:8px;border-radius:50%;background:transparent}
.rail .dot.ok{background:var(--pass)} .rail .dot.try{background:var(--warn)}
main{min-width:0}

@media (max-width:860px){
  .frame{grid-template-columns:minmax(0,1fr);gap:20px;padding-block:16px 48px}
  .rail{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px;margin-inline:-4px}
  .rail .mono{display:none}
  .rail button{grid-template-columns:auto auto;white-space:nowrap;border-color:var(--line);background:var(--surface)}
  .rail button .ttl{display:none} .rail .dot{display:none}
  .suite .lbl{display:none}
}

/* week sheet */
.week{display:flex;flex-direction:column;gap:40px}
.week-head{display:flex;flex-direction:column;gap:12px;max-width:68ch}
.eyebrow{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.lede{font-size:1.1rem;color:var(--muted)}
.sec{display:flex;flex-direction:column;gap:18px}
.sec-h{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:8px}
.sec-h .mono{color:var(--muted)}
.concept{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px 28px}
.concept .blk{display:flex;flex-direction:column;gap:8px;min-width:0}
.concept .blk.wide{grid-column:1/-1}
.concept h3{font-weight:700;font-size:1.05rem}
.concept ul,.concept ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.concept p,.concept li{max-width:68ch}
.term{border-left:3px solid var(--accent);padding:4px 0 4px 12px}
.term b{font-family:var(--f-display)}
.formula{font-family:var(--f-mono);font-size:.9rem;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:pre;line-height:1.7}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--sunk)}
tr:last-child td{border-bottom:0}

/* bench */
.benches{display:flex;flex-direction:column;gap:22px}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.bench-head{display:flex;flex-direction:column;gap:4px;padding:14px 18px;border-bottom:1px dashed var(--line)}
.bench-head .mono{color:var(--accent)}
.bench-head p{color:var(--muted);font-size:.92rem}
.bench-body{padding:18px;display:flex;flex-direction:column;gap:16px;min-width:0}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:700px){.split{grid-template-columns:minmax(0,1fr)}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;font-weight:500;font-size:.92rem}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.panel{background:var(--sunk);border-radius:8px;padding:12px 14px;font-size:.95rem;min-height:3.2em}
.panel b{font-family:var(--f-display)}
input[type=number]{font:inherit;width:6.5em;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
input[type=range]{accent-color:var(--accent);width:min(260px,100%)}
input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px}
label{font-size:.92rem;display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-block;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:4px}
.pill.pass{background:var(--pass-soft);color:var(--pass)} .pill.fail{background:var(--fail-soft);color:var(--fail)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.idle{background:var(--sunk);color:var(--muted)}
svg text{fill:var(--ink);font-family:var(--f-body)}
.svgbox{width:100%;max-width:100%;height:auto;display:block}

/* code block */
pre.code{margin:0;font:14px/1.7 var(--f-mono);background:var(--sunk);border-radius:8px;padding:12px 14px;overflow-x:auto}
pre.code .ln{color:var(--muted);display:inline-block;width:2em;user-select:none}
pre.code .bad{background:var(--fail-soft);color:var(--fail);border-radius:3px;padding:0 2px}
pre.code .hl{background:var(--accent-soft);border-radius:3px}

/* error → fault → failure */
.stages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;position:relative}
@media (max-width:640px){.stages{grid-template-columns:minmax(0,1fr)}}
.stage{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:4px;background:var(--bg);transition:background .35s,border-color .35s,transform .35s}
.stage .mono{color:var(--muted)}
.stage p{font-size:.9rem;color:var(--muted)}
.stage.lit{border-color:var(--warn);background:var(--warn-soft)}
.stage.lit.fail{border-color:var(--fail);background:var(--fail-soft);animation:shake .4s}
.stage.lit.pass{border-color:var(--pass);background:var(--pass-soft)}
@keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}

/* sorter */
.sort-list{display:flex;flex-direction:column;gap:8px}
.sort-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);transition:background .25s,border-color .25s}
.sort-row.ok{background:var(--pass-soft);border-color:var(--pass)}
.sort-row.no{background:var(--fail-soft);border-color:var(--fail)}
.sort-row .why{grid-column:1/-1;font-size:.86rem;color:var(--muted)}
.sort-row .bk{display:flex;gap:6px}
.sort-row .bk button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 10px;font-family:var(--f-mono);font-size:.78rem}
.sort-row .bk button.pick{background:var(--ink);color:var(--bg)}

/* PDCA */
.pdca-seg{cursor:pointer;transition:opacity .25s}
.pdca-seg path{stroke:var(--surface);stroke-width:2}
.spin{transform-origin:110px 110px;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* stairs */
.stairs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;gap:6px;height:190px}
.stairs button{border:1px solid var(--line);background:var(--bg);border-radius:6px 6px 0 0;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;padding:8px 4px;gap:2px;transition:background .3s,color .3s}
.stairs button b{font-family:var(--f-display);font-size:1.3rem}
.stairs button span{font-size:.72rem;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.04em}
.stairs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stairs button.past{background:var(--accent-soft)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:10px}
.tile{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:84px}
.tile .mono{color:var(--muted)}
.tile b{font-family:var(--f-display);font-weight:500;line-height:1.25}
.tile[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.lifebar{display:grid;grid-template-columns:1fr 2fr 2fr;gap:4px}
.lifebar div{padding:10px;border-radius:6px;background:var(--sunk);font-size:.85rem;text-align:center;transition:background .35s,color .35s}
.lifebar div.on{background:var(--accent);color:var(--accent-ink)}

/* checklist */
.checks{display:flex;flex-direction:column;gap:6px}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:6px;flex-wrap:nowrap}
.checks label:hover{background:var(--sunk)}
.stagebox{border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;transition:opacity .3s}
.stagebox.locked{opacity:.45;pointer-events:none}
.prog{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s}
.gate{font-family:var(--f-mono);font-size:.82rem;padding:8px 10px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.gate.open{background:var(--pass-soft);color:var(--pass)}

/* round table */
.table-wrap{position:relative;width:min(340px,100%);aspect-ratio:1;margin-inline:auto}
.table-wrap .tbl{position:absolute;inset:26%;border-radius:50%;background:var(--sunk);border:1px dashed var(--line);display:grid;place-items:center;text-align:center;font-family:var(--f-mono);font-size:.72rem;color:var(--muted);padding:10px}
.seat{position:absolute;transform:translate(-50%,-50%);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:.78rem;white-space:nowrap;transition:background .2s}
.seat[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* stepper */
.stepper{display:flex;flex-direction:column;gap:14px}
.track{position:relative;display:grid;gap:4px}
.track::before{content:"";position:absolute;left:4%;right:4%;top:17px;height:2px;background:var(--line)}
.track .fill{position:absolute;left:4%;top:17px;height:2px;background:var(--accent);transition:width .45s}
.track button{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;font-size:.74rem;text-align:center;line-height:1.25;min-width:0}
.track button i{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-style:normal;font-family:var(--f-mono);font-size:.8rem;transition:background .3s,border-color .3s,transform .3s}
.track button.done i{border-color:var(--accent);background:var(--accent-soft)}
.track button.cur i{border-color:var(--accent);background:var(--accent);color:var(--accent-ink);transform:scale(1.12)}
@media (max-width:640px){.track button span{display:none}}

/* graph */
.graph .edge{fill:none;stroke:var(--line);stroke-width:2.2;transition:stroke .3s}
.graph .edge.hit{stroke:var(--accent)}
.graph .edge.now{stroke:var(--warn);stroke-width:3}
.graph .node circle{fill:var(--surface);stroke:var(--muted);stroke-width:1.6;transition:fill .3s,stroke .3s}
.graph .node.hit circle{fill:var(--accent-soft);stroke:var(--accent)}
.graph .node.cur circle{fill:var(--accent);stroke:var(--accent)}
.graph .node.cur text.id{fill:var(--accent-ink)}
.graph .node text.id{font-family:var(--f-mono);font-size:12px;font-weight:600;text-anchor:middle;dominant-baseline:central}
.graph .node text.cap{font-size:10.5px;fill:var(--muted)}
.graph .elab{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.graph .token{fill:var(--warn);opacity:0;transition:opacity .2s}
.graph .token.on{opacity:1}
.meter{display:flex;flex-direction:column;gap:4px;font-size:.88rem}
.meter .bar{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.meter .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .45s}
.meter .bar i.full{background:var(--pass)}
.log{font-family:var(--f-mono);font-size:.8rem;display:flex;flex-direction:column;gap:4px;max-height:150px;overflow:auto}
.log div{padding:4px 8px;background:var(--sunk);border-radius:4px}

/* number line */
.nl-zone{transition:width .3s,x .3s}
.zone-ok{fill:var(--pass-soft)} .zone-bad{fill:var(--fail-soft)}
.nl-axis{stroke:var(--muted);stroke-width:1.5}
.nl-tick{stroke:var(--muted)}
.nl-lab{font-family:var(--f-mono);font-size:11px;text-anchor:middle}
.nl-dot{fill:var(--accent);transition:cx .3s}
.bva-pt.ok{fill:var(--pass)} .bva-pt.bad{fill:var(--fail)}
.zoom2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.zoom2{grid-template-columns:1fr}}
.zoom2>div{display:flex;flex-direction:column;gap:4px}
.zoom2 .mono{color:var(--muted)}

/* matrix / lcom */
.lcom td,.lcom th{text-align:center}
.lcom td:first-child,.lcom th:first-child{text-align:left}
.dt td.on,.dt th.on{background:var(--accent-soft)}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.toggle button{border:0;background:var(--surface);padding:5px 12px;font-size:.88rem}
.toggle button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* traceability */
.trace{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 34px;position:relative}
.trace .col{display:flex;flex-direction:column;gap:8px;position:relative;z-index:1}
.trace .col .mono{color:var(--muted)}
.trace button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 8px;text-align:left;font-size:.85rem;line-height:1.3;transition:background .25s,border-color .25s,opacity .25s}
.trace button b{font-family:var(--f-mono);font-size:.78rem}
.trace.focus button{opacity:.35}
.trace.focus button.on{opacity:1;border-color:var(--accent);background:var(--accent-soft)}
.trace button.gap{border-style:dashed;border-color:var(--fail)}
.trace svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.trace svg path{fill:none;stroke:var(--line);stroke-width:1.5;transition:stroke .25s,opacity .25s}
.trace.focus svg path{opacity:.2}
.trace.focus svg path.on{stroke:var(--accent);stroke-width:2.4;opacity:1}

/* formality */
.form-meters{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:center;font-size:.9rem}
.pips{display:flex;gap:4px}
.pips i{width:28px;height:10px;border-radius:3px;background:var(--sunk);transition:background .3s}
.pips i.on{background:var(--accent)}

/* quiz runner */
.runner{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.runner-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 18px;background:var(--ink);color:var(--bg)}
.runner-head .mono{color:inherit}
.tc{padding:18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.tc-top{display:flex;gap:10px;align-items:center;justify-content:space-between}
.tc-id{color:var(--muted)}
.tc-q{font-weight:500;max-width:70ch}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 12px;font-size:.93rem;line-height:1.4;transition:background .2s,border-color .2s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .mono{color:var(--muted);padding-top:2px}
.opt.right{background:var(--pass-soft);border-color:var(--pass)}
.opt.wrong{background:var(--fail-soft);border-color:var(--fail)}
.opt:disabled{cursor:default}
.tc-why{font-size:.9rem;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.summary{padding:18px;display:flex;flex-direction:column;gap:12px}
.summary .big{font-family:var(--f-display);font-size:1.6rem;font-weight:700}

<script>
const RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const sleep = ms => new Promise(r => setTimeout(r, RM ? 0 : ms));
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

const NS = 'http://www.w3.org/2000/svg';

/* ---------- generic: sorter ---------- */
function sorter(el, buckets, items){
  el.innerHTML = `<div class="row"><span class="pill idle" id="sScore">0/${items.length} benar</span><button class="btn" data-r>Ulangi</button></div><div class="sort-list"></div>`;
  const list = $('.sort-list', el);
  const draw = () => {
    list.innerHTML = items.map((it,i)=>`<div class="sort-row" data-i="${i}"><span>${it[0]}</span><span class="bk">${buckets.map(b=>`<button data-b="${b}">${b}</button>`).join('')}</span><p class="why" hidden>${it[2]}</p></div>`).join('');
    $('#sScore', el).textContent = `0/${items.length} benar`;
  };
  draw();
  list.addEventListener('click', e => {
    const b = e.target.closest('button[data-b]'); if(!b) return;
    const row = b.closest('.sort-row'); const it = items[+row.dataset.i];
    $$('button', row).forEach(x=>x.classList.toggle('pick', x===b));
    row.classList.remove('ok','no'); void row.offsetWidth;
    row.classList.add(b.dataset.b === it[1] ? 'ok' : 'no');
    $('.why', row).hidden = false;
    $('#sScore', el).textContent = `${$$('.sort-row.ok', list).length}/${items.length} benar`;
  });
  $('[data-r]', el).onclick = draw;
}

/* ---------- generic: stepper ---------- */
function stepper(el, steps){
  let cur = 0, timer = null;
  el.innerHTML = `<div class="stepper">
    <div class="track" style="grid-template-columns:repeat(${steps.length},minmax(0,1fr))"><div class="fill"></div>
      ${steps.map((s,i)=>`<button data-i="${i}"><i>${i+1}</i><span>${s[0]}</span></button>`).join('')}</div>
    <div class="panel" aria-live="polite"></div>
    <div class="row"><button class="btn" data-a="prev">Sebelumnya</button><button class="btn pri" data-a="play">Putar otomatis</button><button class="btn" data-a="next">Berikutnya</button></div></div>`;
  const show = i => {
    cur = Math.max(0, Math.min(steps.length-1, i));
    $$('.track button', el).forEach((b,j)=>{ b.classList.toggle('done', j<cur); b.classList.toggle('cur', j===cur); });
    $('.fill', el).style.width = (92 * cur/(steps.length-1)) + '%';
    $('.panel', el).innerHTML = `<b>Langkah ${cur+1} · ${steps[cur][0]}</b><br>${steps[cur][1]}`;
  };
  const stop = () => { clearInterval(timer); timer = null; $('[data-a=play]', el).textContent = 'Putar otomatis'; };
  el.addEventListener('click', e => {
    const s = e.target.closest('.track button'); if(s){ stop(); show(+s.dataset.i); return; }
    const a = e.target.closest('[data-a]'); if(!a) return;
    if(a.dataset.a==='prev'){ stop(); show(cur-1); }
    if(a.dataset.a==='next'){ stop(); show(cur+1); }
    if(a.dataset.a==='play'){
      if(timer){ stop(); return; }
      if(cur===steps.length-1) show(0);
      a.textContent = 'Jeda';
      timer = setInterval(()=>{ if(!el.isConnected || cur>=steps.length-1){ stop(); return; } show(cur+1); }, 1700);
    }
  });
  show(0);
}

/* ---------- generic: flow graph ---------- */
function shorten(x1,y1,x2,y2,d){ const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy)||1; return [x1+dx/L*d, y1+dy/L*d]; }
function mkGraph(svg, spec){
  const R = spec.r || 16;
  svg.setAttribute('viewBox', spec.vb); svg.classList.add('graph','svgbox');
  svg.innerHTML = `<defs><marker id="${spec.id}-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><g class="E"></g><g class="N"></g><circle class="token" r="7" cx="-40" cy="-40"/>`;
  const edges = {}, nodes = {};
  spec.edges.forEach(([a,b,c,lab]) => {
    const [x1,y1] = spec.nodes[a], [x2,y2] = spec.nodes[b];
    let d;
    if(c){ const s=shorten(x1,y1,c[0],c[1],R), t=shorten(x2,y2,c[0],c[1],R+1); d=`M${s[0]},${s[1]} Q${c[0]},${c[1]} ${t[0]},${t[1]}`; }
    else { const s=shorten(x1,y1,x2,y2,R), t=shorten(x2,y2,x1,y1,R+1); d=`M${s[0]},${s[1]} L${t[0]},${t[1]}`; }
    const p = document.createElementNS(NS,'path');
    p.setAttribute('d', d); p.setAttribute('class','edge'); p.setAttribute('marker-end', `url(#${spec.id}-ar)`);
    $('.E', svg).append(p); edges[a+'-'+b] = p;
    if(lab){ const L=p.getTotalLength(), m=p.getPointAtLength(L/2); const t=document.createElementNS(NS,'text'); t.setAttribute('x', m.x+6); t.setAttribute('y', m.y-4); t.setAttribute('class','elab'); t.textContent=lab; $('.E', svg).append(t); }
  });
  Object.entries(spec.nodes).forEach(([id,[x,y,cap,side]]) => {
    const g = document.createElementNS(NS,'g'); g.setAttribute('class','node');
    const anchor = side==='l' ? 'end' : 'start', dx = side==='l' ? -R-6 : R+6;
    g.innerHTML = `<circle cx="${x}" cy="${y}" r="${R}"/><text class="id" x="${x}" y="${y}">${id}</text>${cap?`<text class="cap" x="${x+dx}" y="${y+4}" text-anchor="${anchor}">${cap}</text>`:''}`;
    $('.N', svg).append(g); nodes[id] = g;
  });
  return { svg, edges, nodes, token: $('.token', svg) };
}
function moveAlong(tok, path, ms){
  return new Promise(res => {
    const L = path.getTotalLength();
    if(RM){ const p=path.getPointAtLength(L); tok.setAttribute('cx',p.x); tok.setAttribute('cy',p.y); res(); return; }
    const t0 = performance.now();
    const f = t => { const k=Math.min(1,(t-t0)/ms); const p=path.getPointAtLength(L*k); tok.setAttribute('cx',p.x); tok.setAttribute('cy',p.y); k<1 ? requestAnimationFrame(f) : res(); };
    requestAnimationFrame(f);
  });
}
async function walk(G, seq, ms=420){
  G.token.classList.add('on');
  Object.values(G.nodes).forEach(n=>n.classList.remove('cur'));
  G.nodes[seq[0]].classList.add('hit','cur');
  for(let i=0;i<seq.length-1;i++){
    const e = G.edges[seq[i]+'-'+seq[i+1]];
    e.classList.add('now');
    await moveAlong(G.token, e, ms);
    e.classList.remove('now'); e.classList.add('hit');
    G.nodes[seq[i]].classList.remove('cur'); G.nodes[seq[i+1]].classList.add('hit','cur');
  }
  await sleep(200);
  G.token.classList.remove('on');
}
function resetGraph(G){ Object.values(G.edges).forEach(e=>e.classList.remove('hit','now')); Object.values(G.nodes).forEach(n=>n.classList.remove('hit','cur')); }

/* ---------- arcs ---------- */
function pt(cx,cy,r,a){ const t=a*Math.PI/180; return [cx+r*Math.sin(t), cy-r*Math.cos(t)]; }
function arc(cx,cy,r0,r1,a0,a1){
  const [x1,y1]=pt(cx,cy,r1,a0),[x2,y2]=pt(cx,cy,r1,a1),[x3,y3]=pt(cx,cy,r0,a1),[x4,y4]=pt(cx,cy,r0,a0);
  return `M${x1},${y1} A${r1},${r1} 0 0 1 ${x2},${y2} L${x3},${y3} A${r0},${r0} 0 0 0 ${x4},${y4} Z`;
}

basis(el){
  el.innerHTML = `<div class="split"><div style="display:flex;flex-direction:column;gap:10px;min-width:0">
    <pre class="code" data-code><span data-l="1">i = 0;
while (i &lt; n-1) do              <span class="mono">①</span></span>
<span data-l="2">  j = i + 1;
  while (j &lt; n) do              <span class="mono">②</span></span>
<span data-l="3">    if A[i] &lt; A[j] then         <span class="mono">③</span></span>
<span data-l="4">      swap(A[i], A[j]);          <span class="mono">④</span></span>
<span data-l="5">  end do;                        <span class="mono">⑤</span></span>
<span data-l="6">  i = i + 1;                     <span class="mono">⑥</span></span>
<span data-l="7">end do;                          <span class="mono">⑦</span></span></pre>
    <div class="formula">E = 9 edge, N = 7 node, P = 3 predikat (①②③)
V(G) = E − N + 2 = 9 − 7 + 2 = 4
V(G) = P + 1     = 3 + 1     = 4</div>
    <div class="row" data-paths></div>
    <div class="log" data-log></div>
  </div><svg data-g></svg></div>`;
  const G = mkGraph($('[data-g]', el), {id:'bp', vb:'0 0 340 370', nodes:{1:[170,34,'while i<n-1'],2:[170,104,'while j<n'],3:[170,180,'if A[i]<A[j]'],4:[90,250,'swap','l'],5:[170,320,'end do'],6:[285,180,'i=i+1'],7:[50,104,'selesai','l']},
    edges:[[1,7],[1,2],[2,3],[3,4],[4,5],[3,5],[5,2,[245,230]],[2,6],[6,1,[300,70]]]});
  $('[data-g]', el).style.maxWidth = '380px';
  const P = [[1,7],[1,2,6,1,7],[1,2,3,4,5,2,6,1,7],[1,2,3,5,2,6,1,7]];
  const seen = new Set(); let busy = false;
  $('[data-paths]', el).innerHTML = P.map((p,i)=>`<button class="btn" data-p="${i}">Jalur ${i+1}</button>`).join('') + `<button class="btn" data-reset>Reset</button>`;
  const hiCode = n => $$('[data-l]', el).forEach(s=>s.classList.toggle('hl', +s.dataset.l===n));
  $$('[data-p]', el).forEach(b => b.onclick = async () => {
    if(busy) return; busy = true; $$('[data-p]', el).forEach(x=>x.disabled=true);
    const p = P[+b.dataset.p], fresh = [];
    for(let i=0;i<p.length-1;i++){ const k=p[i]+'-'+p[i+1]; if(!seen.has(k)){ fresh.push(k.replace('-','→')); seen.add(k);} }
    const obs = new MutationObserver(()=>{ const c = Object.entries(G.nodes).find(([,g])=>g.classList.contains('cur')); if(c) hiCode(+c[0]); });
    Object.values(G.nodes).forEach(g=>obs.observe(g,{attributes:true}));
    await walk(G, p, 380); obs.disconnect(); hiCode(0);
    $('[data-log]', el).insertAdjacentHTML('afterbegin', `<div>Jalur ${+b.dataset.p+1}: ${p.join('→')} · edge baru: ${fresh.length?fresh.join(', '):'tidak ada'} · ${seen.size}/9 edge</div>`);
    busy = false; $$('[data-p]', el).forEach(x=>x.disabled=false);
  });
  $('[data-reset]', el).onclick = () => { if(busy) return; seen.clear(); resetGraph(G); $('[data-log]', el).innerHTML=''; };
},
lcom(el){
  const V = ['a','b','c','d','e','x','y','z'];
  const init = [['a','b','c','d','e'],['a','b','e'],['x','y','z']];
  el.innerHTML = `<p style="font-size:.92rem">Centang instance variable yang dipakai tiap method. Contoh awal diambil dari slide (I1 = {a,b,c,d,e}, I2 = {a,b,e}, I3 = {x,y,z}).</p>
  <div class="tbl-wrap"><table class="lcom"><thead><tr><th>Method</th>${V.map(v=>`<th>${v}</th>`).join('')}</tr></thead><tbody>${init.map((s,m)=>`<tr><td><b>M${m+1}</b></td>${V.map(v=>`<td><input type="checkbox" aria-label="M${m+1} memakai ${v}" data-m="${m}" data-v="${v}" ${s.includes(v)?'checked':''}></td>`).join('')}</tr>`).join('')}</tbody></table></div>
  <div class="split"><div class="formula" data-pairs></div><div class="panel" data-res aria-live="polite"></div></div>`;
  const calc = () => {
    const sets = [0,1,2].map(m => new Set($$(`input[data-m="${m}"]`, el).filter(x=>x.checked).map(x=>x.dataset.v)));
    let P=0, Q=0, lines=[];
    [[0,1],[0,2],[1,2]].forEach(([i,j]) => { const inter=[...sets[i]].filter(v=>sets[j].has(v)); if(inter.length){Q++; lines.push(`I${i+1} ∩ I${j+1} = {${inter.join(',')}}  → Q`);} else {P++; lines.push(`I${i+1} ∩ I${j+1} = ∅          → P`);} });
    const L = P>Q ? P-Q : 0;
    $('[data-pairs]', el).textContent = lines.join('\n') + `\n\n|P| = ${P}, |Q| = ${Q}`;
    $('[data-res]', el).innerHTML = `<b>LCOM = ${L}</b> <span class="pill ${L===0?'pass':'warn'}">${L===0?'cukup kohesif':'kurang kohesif'}</span><br>${L>0?'Ada method yang tidak berbagi variabel dengan method lain. Class ini mungkin bisa dipecah.':'Sebagian besar pasangan method berbagi variabel. Catatan: LCOM = 0 belum tentu kohesi maksimal.'}`;
  };
  el.addEventListener('change', calc); calc();
},

whitebox(el){
  el.innerHTML = `<div class="split"><div style="display:flex;flex-direction:column;gap:12px;min-width:0">
    <pre class="code"><span class="mono">①</span> input(Y)
<span class="mono">②</span> if (Y &lt;= 0) then
<span class="mono">③</span>    Y := −Y
   end_if

   end_while
<span class="mono">⑥</span> selesai</pre>

    <div class="row"><label for="wbY">Nilai Y: <b data-y>-1</b></label><input type="range" id="wbY" min="-4" max="4" value="-1"><button class="btn pri" data-run>Jalankan test</button><button class="btn" data-reset>Reset</button></div>
    <div class="meter"><span data-sl>Statement coverage 0/6</span><div class="bar"><i data-sb></i></div></div>
    <div class="meter"><span data-bl>Branch (edge) coverage 0/7</span><div class="bar"><i data-bb></i></div></div>
    <div class="log" data-log></div>
    <p style="font-size:.88rem;color:var(--muted)">Tantangan: capai 100% branch coverage dengan test sesedikit mungkin.</p>
  </div><svg data-g></svg></div>`;
  const G = mkGraph($('[data-g]', el), {id:'wb', vb:'0 0 330 360', nodes:{1:[150,30,'input(Y)'],2:[150,100,'Y<=0 ?'],3:[60,165,'Y := −Y','l'],4:[150,230,'Y>0 ?','l'],5:[270,230,'Y := Y−1'],6:[150,320,'selesai']},
    edges:[[1,2],[2,3,null,'T'],[2,4,null,'F'],[3,4],[4,5,[210,195],'T'],[5,4,[210,265]],[4,6,null,'F']]});
  $('[data-g]', el).style.maxWidth = '360px';
  const nodesSeen = new Set(), edgesSeen = new Set(); let busy=false, runs=0;
  const r = $('#wbY', el); r.oninput = () => $('[data-y]', el).textContent = r.value;
  const upd = () => {
    $('[data-sl]', el).textContent = `Statement coverage ${nodesSeen.size}/6`; $('[data-bl]', el).textContent = `Branch (edge) coverage ${edgesSeen.size}/7`;
    const s=$('[data-sb]', el), b=$('[data-bb]', el); s.style.width = nodesSeen.size/6*100+'%'; b.style.width = edgesSeen.size/7*100+'%';
    s.classList.toggle('full', nodesSeen.size===6); b.classList.toggle('full', edgesSeen.size===7);
  };
  $('[data-run]', el).onclick = async () => {
    if(busy) return; busy=true; $('[data-run]', el).disabled=true;
    let Y = +r.value; const y0 = Y; const seq=[1,2];
    if(Y<=0){ seq.push(3); Y=-Y; } seq.push(4);
    while(Y>0){ seq.push(5); Y--; seq.push(4); } seq.push(6);
    seq.forEach(n=>nodesSeen.add(n)); for(let i=0;i<seq.length-1;i++) edgesSeen.add(seq[i]+'-'+seq[i+1]);
    await walk(G, seq, 330); runs++;
    $('[data-log]', el).insertAdjacentHTML('afterbegin', `<div>Test ${runs}: Y = ${y0} → ${seq.join('→')}</div>`);
    upd();
    if(edgesSeen.size===7) $('[data-log]', el).insertAdjacentHTML('afterbegin', `<div style="color:var(--pass)">100% branch coverage dengan ${runs} test.${runs===2?' Optimal!':' Bisa dengan 2 test, misalnya Y = −1 dan Y = 1.'}</div>`);
    busy=false; $('[data-run]', el).disabled=false;
  };
  $('[data-reset]', el).onclick = () => { if(busy) return; nodesSeen.clear(); edgesSeen.clear(); runs=0; resetGraph(G); $('[data-log]', el).innerHTML=''; upd(); };
  upd();

trace(el){
  const R = [['R1','Login pengguna'],['R2','Cetak laporan'],['R3','Ekspor data'],['R4','Notifikasi email']];
  const D = [['D1','Modul autentikasi'],['D2','Modul laporan'],['D3','Ekspor CSV'],['D4','Ekspor PDF']];
  const T = [['T1','Uji login valid'],['T2','Uji login gagal'],['T3','Uji cetak'],['T4','Uji ekspor CSV'],['T5','Uji ekspor PDF'],['T6','Uji fitur chat']];
  const L = [['R1','D1'],['R2','D2'],['R3','D3'],['R3','D4'],['D1','T1'],['D1','T2'],['D2','T3'],['D3','T4'],['D4','T5']];
  const col = (t,arr) => `<div class="col"><span class="mono">${t}</span>${arr.map(x=>`<button data-id="${x[0]}"><b>${x[0]}</b> ${x[1]}</button>`).join('')}</div>`;
  el.innerHTML = `<div class="trace">${col('Requirement',R)}${col('Desain',D)}${col('Test',T)}<svg></svg></div><div class="panel" aria-live="polite">Klik item mana pun. Requirement ditelusuri ke depan (forward), test ditelusuri ke belakang (backward).</div>`;
  const tr = $('.trace', el), svg = $('svg', tr);
  const by = id => $(`[data-id="${id}"]`, tr);
  const drawLines = () => {
    const box = tr.getBoundingClientRect();
    svg.setAttribute('viewBox', `0 0 ${box.width} ${box.height}`);
    svg.innerHTML = L.map(([a,b])=>{ const A=by(a).getBoundingClientRect(), B=by(b).getBoundingClientRect(); const x1=A.right-box.left, y1=A.top+A.height/2-box.top, x2=B.left-box.left, y2=B.top+B.height/2-box.top, m=(x1+x2)/2; return `<path data-l="${a}-${b}" d="M${x1},${y1} C${m},${y1} ${m},${y2} ${x2},${y2}"/>`; }).join('');
  };
  const linked = id => L.filter(l=>l.includes(id));
  ['R4','T6'].forEach(g=>by(g).classList.add('gap'));
  const chain = (id, dir) => { const out=new Set([id]), edges=new Set(); let front=[id]; while(front.length){ const nx=[]; front.forEach(f=>L.forEach(([a,b])=>{ if(dir>0&&a===f&&!out.has(b)){out.add(b);edges.add(a+'-'+b);nx.push(b);} if(dir<0&&b===f&&!out.has(a)){out.add(a);edges.add(a+'-'+b);nx.push(a);} })); front=nx; } return [out,edges]; };
  tr.addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b) return; const id = b.dataset.id;
    let nodes, edges, msg;
    if(id[0]==='R'){ [nodes,edges]=chain(id,1); msg = nodes.size===1 ? `<b>Forward trace ${id}: gap!</b> Requirement ini tidak punya desain maupun test. Ada kebutuhan yang belum dikerjakan.` : `<b>Forward trace ${id}</b>: ${[...nodes].join(' → ')}. Setiap input fase punya output.`; }
    else if(id[0]==='T'){ [nodes,edges]=chain(id,-1); msg = nodes.size===1 ? `<b>Backward trace ${id}: gap!</b> Test ini tidak berasal dari requirement mana pun. Fitur ini dari mana?` : `<b>Backward trace ${id}</b>: ${[...nodes].reverse().join(' → ')}. Output bisa dilacak ke inputnya.`; }
    else { const [n1,e1]=chain(id,1), [n2,e2]=chain(id,-1); nodes=new Set([...n1,...n2]); edges=new Set([...e1,...e2]); msg = `<b>${id}</b> dilacak dua arah: ${[...nodes].join(', ')}.`; }
    tr.classList.add('focus');
    $$('button', tr).forEach(x=>x.classList.toggle('on', nodes.has(x.dataset.id)));
    $$('path', svg).forEach(p=>p.classList.toggle('on', edges.has(p.dataset.l)));
    $('.panel', el).innerHTML = msg;
  });
  requestAnimationFrame(drawLines);
  const ro = new ResizeObserver(()=>{ if(el.isConnected) drawLines(); }); ro.observe(tr);
}
};

  <div class="blk"><h3>SQA: IEEE vs Galin</h3>

{ id:'w2', n:2, title:'Software Quality Model & Metric', tag:'Quality Model', short:'McCall, Boehm, ISO 9126, FURPS, CMMI, Six Sigma, metrik Halstead.',
  lede:'Cara mendefinisikan kualitas dengan model, lalu mengukurnya dengan metrik.',
  concept:`
  <div class="blk"><h3>Dua kelompok model</h3>
    <p><b>Product-based</b> menilai kualitas dari produk jadinya: McCall, Boehm, ISO 9126 / ISO 25010, FURPS, Dromey.</p>
    <p><b>Process-based</b> menilai dari kematangan proses pengembangan: CMMI, ISO 9001, Lean Six Sigma.</p></div>
  <div class="blk"><h3>McCall (1977)</h3>
    <p>11 faktor dan 23 kriteria. Hierarkinya: <b>Factor</b> (sudut pandang user, untuk <i>specify</i>) → <b>Criteria</b> (sudut pandang developer, untuk <i>build</i>) → <b>Metric</b> (untuk <i>control</i>).</p>
    <p>Hubungan antar-faktor bisa <b>indifferent</b>, <b>complementary</b> (flexibility ↔ maintainability), atau <b>conflicting</b> (portability ↔ efficiency).</p></div>
  <div class="blk"><h3>Model lain</h3>
    <ul><li><b>Boehm (1978)</b>: Primary uses → Intermediate constructs → Primitive constructs.</li><li><b>ISO 9126</b>: Functionality, Reliability, Usability, Efficiency, Maintainability, Portability. Penerusnya <b>ISO 25010</b>.</li><li><b>FURPS</b> (Grady): Functionality, Usability, Reliability, Performance, Supportability.</li><li><b>Lean Six Sigma</b>: mengurangi variasi proses dengan siklus DMAIC (Define, Measure, Analyze, Improve, Control).</li></ul></div>
  <div class="blk"><h3>Measure vs metric</h3>
    <p><b>Measure</b>: indikasi kuantitatif, misalnya jumlah error. <b>Metric</b>: derajat suatu atribut, misalnya error per person-hour.</p>
    <p>Tiga jenis metrik: <b>product</b> (ukuran, kompleksitas), <b>process</b> (efektivitas defect removal), dan <b>project</b> (biaya, jadwal, produktivitas).</p></div>
  <div class="blk wide"><h3>Rumus penting</h3>
    <div class="formula">Integrity          = Σ [1 − threat × (1 − security)]
Specificity (req)  Q = n_ui / n_r
Design (Card&Glass) S(i) = fout(i)²   D(i) = v(i)/[fout(i)+1]   C(i) = S(i) + D(i)
Halstead           N = N1 + N2   V = N·log2(n1+n2)   D = (n1/2)·(N2/n2)   E = D·V   T = E/18
Maintenance        SMI = [MT − (Fc + Fa + Fd)] / MT</div></div>`,
  labs:[['mccall','Segitiga McCall','Klik sisi segitiga untuk melihat kelompok faktor, lalu klik faktor untuk melihat kriterianya.'],['halstead','Kalkulator Halstead','Hitung length, volume, difficulty, effort, dan waktu dari jumlah operator dan operand.'],['cmmi','Tangga CMMI','Naiki 5 level kematangan proses organisasi.']],

  <div class="blk"><h3>6 kelas komponen SQA (Galin)</h3>
    <ol><li>Pre-project</li><li>Project life cycle</li><li>Infrastructure: pencegahan error dan perbaikan</li><li>Software quality management</li><li>Standardization, certification &amp; SQA assessment</li><li>Organizing for SQA (komponen manusia)</li></ol></div>
  <div class="blk"><h3>Dua jenis standar</h3>
    <p><b>Quality management standards</b> menjawab "apa" yang harus dicapai dan membiarkan organisasi memilih caranya. Contoh: SEI CMM, ISO 9001, ISO 9000-3.</p>
    <p><b>Project process standards</b> menjawab "bagaimana" melakukannya. Contoh: IEEE 1012, ISO/IEC 12207.</p></div>
  <div class="blk"><h3>Organisasi SQA</h3>
    <ul><li><b>Manajemen</b>: menetapkan kebijakan mutu, menyediakan sumber daya dan staf, serta menindaklanjuti kepatuhan.</li><li><b>SQA unit</b>: satu-satunya bagian yang full-time. Tugasnya program mutu tahunan, konsultasi, audit internal, memimpin komite, dan memelihara infrastruktur.</li><li><b>Trustees, committees, forums</b>: anggota paruh waktu atau sukarela.</li></ul></div>
  <div class="blk"><h3>Contract review</h3>
    <p>Proposal yang asal-asalan atau kontrak yang tidak dipahami bisa menyebabkan kerugian finansial besar. Contract review diwajibkan oleh ISO 9001.</p>
    <p><b>Faktor yang menentukan besar upaya review</b>: besar proyek, kompleksitas teknis, pengalaman staf, dan kompleksitas organisasi.</p>

  concept:`
  <div class="blk wide"><div class="tbl-wrap"><table><thead><tr><th>Parameter</th><th>Verification</th><th>Validation</th></tr></thead><tbody>
    <tr><td>Pertanyaan</td><td>Are we building the product right?</td><td>Are we building the right product?</td></tr>
    <tr><td>Jenis</td><td>Static testing, tanpa eksekusi kode</td><td>Dynamic testing, kode dijalankan</td></tr>
    <tr><td>Metode</td><td>Review, walkthrough, inspection, desk-checking</td><td>Black box, white box, non-functional testing</td></tr>
    <tr><td>Target</td><td>Arsitektur, desain, database, dokumen</td><td>Produk software sebenarnya</td></tr>
    <tr><td>Tim &amp; urutan</td><td>Tim QA, dilakukan lebih dulu</td><td>Tim testing bersama QA, dilakukan sesudahnya</td></tr></tbody></table></div></div>
  <div class="blk"><h3>Kenapa review penting</h3>
    <p>Error yang ditemukan lebih awal lebih murah diperbaiki, dan review mengurangi rework di akhir proyek.</p>
    <p><b>Langkah</b>: planning, preparation, menyusun rapat, mencatat error, koreksi (di luar rapat), verifikasi koreksi.</p>
    <p><b>Laporan review</b>: jenis review, tim, waktu, item, agenda, checklist, komentar, aksi (no action / fix / reconsider), dan keputusan.</p></div>
  <div class="blk"><h3>Walkthrough, inspection, FTR</h3>
    <p><b>Walkthrough</b>: 4–6 orang, dipimpin SQA. Tujuannya menemukan dan mencatat fault, bukan memperbaikinya. Bisa <i>participant-driven</i> atau <i>document-driven</i>.</p>
    <p><b>Inspection</b>: lebih formal, 5 langkah (lihat lab).</p>
    <p><b>FTR</b>: kelas review yang mencakup walkthrough dan inspection. Fokus pada bagian kecil produk. Hasilnya <b>accept</b>, <b>reject</b> (review ulang), atau <b>accept provisionally</b> (perbaiki error minor tanpa review ulang).</p></div>
  <div class="blk wide"><h3>QA vs QC</h3><p>QA itu preventif dan fokus pada proses. Sifatnya statis (review dokumen), termasuk wilayah verifikasi, dan menjadi tanggung jawab seluruh tim SDLC. QC itu korektif dan fokus pada produk. Sifatnya dinamis (testing), termasuk wilayah validasi, dan menjadi tanggung jawab tim testing (STLC).</p></div>`,
  labs:[['vv','Pilah: verifikasi atau validasi?','Tentukan apakah aktivitas memeriksa dokumen/kode (statis) atau menjalankan produk (dinamis).'],['roles','Meja review','Kenali tujuh pemain dalam sebuah review.'],['inspection','Alur inspection','Ikuti lima langkah inspeksi formal.']],
  quiz:[
    {q:'"Are we building the product right?" adalah pertanyaan untuk…', o:['Validation','Verification','Quality control','Acceptance'], a:1, e:'Verification memastikan produk dibangun sesuai spesifikasi.'},
    {q:'Ciri utama validation adalah…', o:['Tidak menjalankan kode','Hanya memeriksa dokumen','Menjalankan kode atau produk','Dilakukan sebelum verifikasi'], a:2, e:'Validation adalah dynamic testing: unit, integration, system, dan UAT.'},
    {q:'Tujuan walkthrough adalah…', o:['Memperbaiki semua fault saat rapat','Menemukan dan mencatat fault, bukan memperbaikinya','Menilai kinerja programmer','Menjalankan test otomatis'], a:1, e:'Perbaikan dilakukan di luar rapat. Walkthrough fokus menemukan dan mencatat.'},
    {q:'Urutan langkah inspection yang benar adalah…', o:['Preparation → Overview → Rework → Inspection → Follow-up','Overview → Preparation → Inspection → Rework → Follow-up','Inspection → Overview → Follow-up → Rework → Preparation','Overview → Inspection → Preparation → Follow-up → Rework'], a:1, e:'Overview, Preparation, Inspection meeting, Rework, lalu Follow-up oleh moderator.'},
    {q:'Ditemukan error minor yang harus diperbaiki tanpa review ulang. Keputusan FTR-nya…', o:['Accept tanpa modifikasi','Reject','Accept provisionally','Escalate'], a:2, e:'Accept provisionally: error minor diperbaiki, tidak perlu review tambahan.'},
    {q:'Aktivitas QC menjadi tanggung jawab…', o:['Seluruh tim SDLC','Tim testing (STLC)','Pelanggan','Manajemen puncak saja'], a:1, e:'QC dilakukan tim testing. QA menjadi tanggung jawab seluruh tim SDLC.'}
  ]},
{ id:'w5', n:5, title:'Product QA & Software Metric', tag:'Product Assurance', short:'Direct vs indirect measure, Halstead, cyclomatic complexity, metrik OO.',
  lede:'Untuk menilai kualitas produk, ukurannya harus jelas. Minggu ini membahas metrik ukuran, kompleksitas, dan desain berorientasi objek.',
  concept:`
  <div class="blk"><h3>Product QA</h3>
    <p>Topik di slide: evaluasi kualitas produk, proses perbaikan (<b>corrective action</b> untuk memperbaiki masalah yang sudah terjadi, <b>preventive action</b> untuk mencegahnya), aktivitas product assurance, dan metrik kualitas produk.</p>
    <p><b>Alasan mengukur</b>: menilai, memprediksi, dan meningkatkan kualitas; estimasi biaya dan jadwal; melihat tren produktivitas.</p></div>
  <div class="blk"><h3>Jenis ukuran</h3>
    <p><b>Direct</b> (atribut internal): biaya, effort, LOC, kecepatan, memori.</p>
    <p><b>Indirect</b> (atribut eksternal): fungsionalitas, kualitas, kompleksitas, reliability, maintainability.</p>
    <p><b>Size-oriented</b>: errors/KLOC, defects/KLOC, cost/LOC. Mudah dihitung tetapi bergantung pada bahasa dan programmer.</p></div>
  <div class="blk"><h3>Cyclomatic complexity (McCabe)</h3>
    <div class="formula">V(G) = E − N + 2
V(G) = P + 1        (P = predicate node)
V(G) = R            (jumlah region)</div>
    <p>Menyatakan jumlah jalur independen. Nilai sebaiknya <b>tidak lebih dari 10</b>; di atas itu, testing menjadi sangat sulit.</p></div>
  <div class="blk"><h3>Metrik OO (Chidamber &amp; Kemerer)</h3>
    <ul><li><b>WMC</b>: jumlah kompleksitas semua method dalam class.</li><li><b>DIT</b>: kedalaman pohon pewarisan sampai root.</li><li><b>NOC</b>: jumlah subclass langsung.</li><li><b>CBO</b>: jumlah class lain yang direferensikan. Fan-out tinggi tidak diinginkan.</li><li><b>RFC</b>: jumlah method yang bisa dipanggil sebagai respons atas sebuah pesan.</li><li><b>LCOM</b>: |P| − |Q| bila P &gt; Q, selain itu 0.</li></ul></div>
  <div class="blk wide"><h3>Metrik lain</h3><p><b>McClure</b>: C + V (jumlah perbandingan + variabel kontrol). <b>Desain</b>: fan-in, fan-out, coupling Mc = k/m. <b>Tools</b>: McCabe ToolSet, CCCC, JMetric, GEN++.</p></div>`,
  labs:[['basis','Flow graph & jalur independen','Contoh dari materi: dua loop bersarang. Jalankan keempat basis path dan lihat edge baru yang ditambahkan tiap jalur.'],['lcom','Playground LCOM','Ubah variabel yang dipakai tiap method, lalu lihat perubahan nilai kohesinya.']],
  quiz:[
    {q:'Flow graph punya 9 edge dan 7 node. Berapa V(G)?', o:['2','3','4','16'], a:2, e:'V(G) = E − N + 2 = 9 − 7 + 2 = 4.'},
    {q:'Nilai cyclomatic complexity yang disarankan maksimal…', o:['5','10','20','50'], a:1, e:'Data eksperimen menunjukkan V(G) sebaiknya tidak lebih dari 10.'},
    {q:'Mana yang termasuk direct measure?', o:['Reliability','Maintainability','Lines of code','Kualitas'], a:2, e:'LOC, biaya, effort, kecepatan, dan memori adalah direct measure.'},
    {q:'DIT (Depth of Inheritance Tree) mengukur…', o:['Jumlah subclass langsung','Panjang maksimum dari class ke root','Jumlah method per class','Jumlah class yang direferensikan'], a:1, e:'Pohon pewarisan yang dalam berarti desain lebih kompleks dan perilaku lebih sulit diprediksi.'},
    {q:'Rumus Halstead Effort adalah…', o:['E = N1 + N2','E = D × V','E = V / D','E = n1 log2 n1'], a:1, e:'Effort = Difficulty × Volume.'},
    {q:'Nilai CBO yang tinggi menunjukkan…', o:['Reuse tinggi dan desain baik','Coupling tinggi yang tidak diinginkan','Kohesi tinggi','Pewarisan dangkal'], a:1, e:'Fan-out tinggi berarti class sangat bergantung pada class lain, dan reuse menurun.'}
  ]},
{ id:'w6', n:6, title:'Software Testing: White Box & Black Box', tag:'SW Testing', short:'Logic coverage, basis path testing, equivalence partitioning, BVA, decision table.',
  lede:'White box menurunkan test dari struktur kode. Black box menurunkan test dari spesifikasi. Keduanya saling melengkapi.',
  concept:`
  <div class="blk"><h3>White box (glass box / structural)</h3>
    <p>Test case diturunkan dari logika internal kode, tetapi hasil yang diharapkan tetap berasal dari requirement. Paling banyak dipakai di level unit dan komponen.</p>
    <p><b>Coverage</b>: statement (node) → branch (edge) → condition → branch/condition → compound condition → path.</p></div>
  <div class="blk"><h3>Basis path testing</h3>
    <ol><li>Petakan kode ke control flow graph.</li><li>Hitung V(G).</li><li>Tentukan himpunan jalur independen.</li><li>Buat test case untuk setiap jalur.</li></ol>
    <p>Bisa menangkap sekitar 60–70% bug di unit testing, tetapi tidak bisa mendeteksi fungsi yang hilang, interface error, database error, dan sebagian initialization error.</p></div>
  <div class="blk"><h3>Black box (functional / behavioral)</h3>
    <p>Mengabaikan mekanisme internal dan hanya melihat input dan output. Black box menemukan: fungsi yang salah atau hilang, interface error, error struktur data, error performa, dan error inisialisasi/terminasi.</p></div>
  <div class="blk"><h3>Teknik black box</h3>
    <ul><li><b>Equivalence partitioning</b>: input berupa range menghasilkan 1 kelas valid dan 2 invalid; input boolean atau himpunan menghasilkan 1 valid dan 1 invalid.</li><li><b>Boundary value analysis</b>: untuk [a, b], uji a−1, a, a+1, b−1, b, b+1.</li><li><b>Decision table</b>: untuk aturan bisnis yang kompleks.</li><li>Cause-effect graph, error guessing.</li></ul></div>`,
  labs:[['whitebox','Simulator coverage white box','Pilih nilai Y dan lihat jalur yang dilalui di flow graph. Coverage bertambah dari setiap test.'],['bva','Equivalence partitioning & BVA','Garis bilangan dengan kelas valid/invalid dan titik boundary yang di-zoom.'],['dtable','Decision table','Ubah kondisi dan lihat aturan (rule) mana yang berlaku.']],
  quiz:[
    {q:'Input berupa range [1..999]. Menurut equivalence partitioning, kelas yang terbentuk adalah…', o:['1 valid, 1 invalid','1 valid, 2 invalid','2 valid, 1 invalid','3 valid'], a:1, e:'Satu kelas valid di dalam range, dua invalid (di bawah batas bawah dan di atas batas atas).'},
    {q:'Range [10, 50]. Nilai uji BVA yang tepat adalah…', o:['10, 30, 50','9, 10, 11, 49, 50, 51','0, 10, 50, 100','11, 49'], a:1, e:'a−1, a, a+1, b−1, b, b+1.'},
    {q:'Jumlah jalur independen di basis set sama dengan…', o:['Jumlah node','Jumlah edge','Cyclomatic complexity V(G)','Jumlah variabel'], a:2, e:'V(G) menyatakan jumlah jalur independen, yaitu jumlah test minimum untuk basis path testing.'},
    {q:'Error yang bisa ditemukan black box tetapi tidak oleh basis path testing adalah…', o:['Statement yang tidak pernah dieksekusi','Fungsi yang hilang (missing function)','Loop tak berujung','Branch yang tidak ter-cover'], a:1, e:'Path testing hanya melihat kode yang ada, jadi tidak bisa menemukan fungsi yang tidak ditulis.'},
    {q:'Branch coverage disebut juga…', o:['Node coverage','Edge coverage','Path coverage','Data coverage'], a:1, e:'Setiap branch (edge) dilalui minimal sekali.'},
    {q:'Decision table paling cocok untuk menguji…', o:['Batas nilai input','Aturan bisnis yang kompleks','Performa sistem','Struktur loop'], a:1, e:'Decision table mencatat kombinasi kondisi dan aksi dari aturan bisnis yang kompleks.'}
  ]},
{ id:'w7', n:7, title:'Process Assurance Activities', tag:'Process Assurance', short:'Peran SQA group, traceability, audit, standar, jenis review, inspeksi.',
  lede:'Aktivitas yang memastikan proses benar-benar diikuti: review, traceability, testing, audit, dan standar.',
  concept:`
  <div class="blk"><h3>Aktivitas SQA</h3>
    <p>Process definition &amp; standards, formal technical reviews, analysis &amp; reporting, measurement, serta test planning &amp; review.</p>
    <p><b>Peran tim kualitas</b>: mereview aplikasi, memberi saran teknis, membangun lingkungan mutu, menyusun standar dan guideline, serta menganalisis error pengembangan (jenis, biaya, besarnya).</p></div>
  <div class="blk"><h3>Tugas SQA group</h3>
    <ul><li>Menyusun <b>SQA plan</b>: evaluasi, audit, standar, prosedur pelaporan error, dan dokumen yang dihasilkan.</li><li>Ikut menyusun deskripsi proses software.</li><li>Mereview kepatuhan aktivitas terhadap proses yang ditetapkan.</li><li>Mengaudit work product.</li><li>Mencatat <b>noncompliance</b>, melaporkannya ke manajemen senior, dan memantaunya sampai selesai.</li></ul></div>
  <div class="blk"><h3>Traceability, testing, audit</h3>
    <p><b>Forward</b>: setiap input fase dipasangkan dengan output. <b>Backward</b>: setiap output bisa dilacak ke input.</p>
    <p>Testing bisa memakan sekitar 50% biaya proyek, jadi lakukan walkthrough dan inspection dulu karena lebih murah.</p>
    <p><b>Audit sebelum rilis</b>: <i>physical audit</i> memastikan semua item konfigurasi ada; <i>functional audit</i> memastikan unit, integration, dan acceptance test sudah dilakukan dan tercatat.</p></div>
  <div class="blk"><h3>Standar &amp; review</h3>
    <p><b>Standard</b>: kriteria baku yang disetujui. <b>Guideline</b>: lebih fleksibel dan memberi ruang untuk pertimbangan.</p>
    <p><b>Technical review meeting</b>: 3–5 reviewer, persiapan dan rapat masing-masing kurang dari 2 jam, fokus pada bagian kecil, dan wajib ada follow-up.</p>
    <p><b>Manfaat inspeksi</b>: produktivitas naik 30–100%, waktu proyek hemat 10–30%, biaya test turun 5–10×. Kekurangannya ada biaya awal dan prosesnya tidak sepenuhnya repeatable.</p></div>`,
  labs:[['formality','Spektrum formalitas review','Geser dari buddy check sampai inspection dan bandingkan ciri-cirinya.'],['gilb','Proses inspeksi Gilb & Graham','Sembilan langkah inspeksi, dari Entry sampai Exit.'],['trace','Traceability matrix','Lacak requirement ke depan dan test ke belakang. Cari dua gap yang ada.']],
  quiz:[
    {q:'Forward traceability berarti…', o:['Setiap output bisa dilacak ke inputnya','Setiap input fase dipasangkan dengan output di fase itu','Test dijalankan dari akhir ke awal','Dokumen disimpan berurutan'], a:1, e:'Forward menunjukkan kelengkapan: tidak ada input yang tertinggal. Backward memastikan setiap output punya asal.'},
    {q:'Physical audit sebelum rilis memeriksa bahwa…', o:['Semua item konfigurasi ada','Semua test lulus','Kode sudah di-review','Pengguna puas'], a:0, e:'Functional audit memeriksa catatan unit, integration, dan acceptance test.'},
    {q:'Jenis review yang paling formal adalah…', o:['Buddy check','Walkthrough','Review by circulation','Inspection'], a:3, e:'Inspection punya peran jelas, pengumpulan data, dan target kuantitatif.'},
    {q:'Rapat technical review yang ideal melibatkan…', o:['1 reviewer, tanpa batas waktu','3–5 reviewer, kurang dari 2 jam','10+ reviewer, seharian','Seluruh tim, mingguan'], a:1, e:'3–5 orang, persiapan dan rapat masing-masing kurang dari 2 jam, fokus pada bagian kecil.'},
    {q:'Apa yang dilakukan SQA group terhadap noncompliance?', o:['Mengabaikannya bila kecil','Mencatat, melaporkan ke manajemen senior, dan memantau sampai selesai','Langsung memperbaiki kodenya','Menghapus dokumen terkait'], a:1, e:'Item noncompliance dipantau sampai terselesaikan.'},
    {q:'Perbedaan guideline dan standard adalah…', o:['Guideline lebih wajib','Guideline memberi ruang pertimbangan dan fleksibilitas','Keduanya identik','Standard hanya untuk dokumentasi'], a:1, e:'Dorfman & Thayer: guideline mengarahkan aktivitas tetapi tetap fleksibel.'}
  ]}
];

/* =================== QUIZ =================== */
const key = id => 'sqa-best-' + id;
function renderQuiz(el, w){
  let picks = new Array(w.quiz.length).fill(null);
  const tag = w.id.toUpperCase();
  el.innerHTML = `<div class="runner"><div class="runner-head"><span class="mono">Test suite · ${w.title}</span><span class="mono" data-stat>0/${w.quiz.length} dijalankan</span></div>
    ${w.quiz.map((q,i)=>`<div class="tc" data-i="${i}"><div class="tc-top"><span class="tc-id mono">TC-${tag}-${String(i+1).padStart(2,'0')}</span><span class="pill idle" data-pill>belum dijalankan</span></div><p class="tc-q">${q.q}</p><div class="opts">${q.o.map((o,j)=>`<button class="opt" data-j="${j}"><span class="mono">${'ABCD'[j]}</span><span>${o}</span></button>`).join('')}</div><p class="tc-why" hidden></p></div>`).join('')}
    <div class="summary" hidden></div></div>`;
  el.onclick = e => {
    const b = e.target.closest('.opt'); if(!b || b.disabled) return;
    const tc = b.closest('.tc'), i = +tc.dataset.i, q = w.quiz[i], j = +b.dataset.j;
    picks[i] = j;
    $$('.opt', tc).forEach((o,k)=>{ o.disabled = true; if(k===q.a) o.classList.add('right'); if(k===j && j!==q.a) o.classList.add('wrong'); });
    const ok = j===q.a, p = $('[data-pill]', tc); p.className = 'pill ' + (ok?'pass':'fail'); p.textContent = ok ? 'PASS' : 'FAIL';
    const why = $('.tc-why', tc); why.hidden = false; why.textContent = q.e;
    const done = picks.filter(x=>x!==null).length;
    $('[data-stat]', el).textContent = `${done}/${w.quiz.length} dijalankan`;
    if(done === w.quiz.length) finish();
  };
  function finish(){
    const score = picks.filter((p,i)=>p===w.quiz[i].a).length, n = w.quiz.length, pct = Math.round(score/n*100), pass = pct>=70;
    const best = Math.max(store.get(key(w.id)) ?? 0, pct); store.set(key(w.id), best); refreshProgress();
    const s = $('.summary', el); s.hidden = false;
    s.innerHTML = `<div class="sumbar">${picks.map((p,i)=>`<i class="${p===w.quiz[i].a?'p':'f'}"></i>`).join('')}</div>
      <div class="row"><span class="big">${score}/${n} PASS</span><span class="pill ${pass?'pass':'fail'}">${pass?'Suite lulus':'Suite gagal'} · ${pct}%</span><span class="mono" style="color:var(--muted)">Skor terbaik ${best}%</span></div>
      <p>${pass?'Bagus. Lanjutkan ke minggu berikutnya atau ulangi untuk skor sempurna.':'Baca lagi bagian konsep dan coba lab-nya, lalu ulangi tes. Batas lulus 70%.'}</p>
      <div class="row"><button class="btn pri" data-retry>Ulangi tes</button></div>`;
    $('[data-retry]', s).onclick = () => { renderQuiz(el, w); el.scrollIntoView({behavior: RM?'auto':'smooth', block:'start'}); };
  }
}

/* =================== VIEWS =================== */
const main = $('#main'), rail = $('#rail');
function statusOf(id){ const b = store.get(key(id)); return b==null ? null : b>=70 ? 'ok' : 'try'; }
function refreshProgress(){
  const st = WEEKS.map(w=>statusOf(w.id));
  $('#suiteBar').innerHTML = st.map(s=>`<i class="${s||''}"></i>`).join('');
  $('#suiteTxt').textContent = `${st.filter(s=>s==='ok').length}/7`;
  WEEKS.forEach(w => { const d = $(`[data-go="${w.id}"] .dot`, rail); if(d) d.className = 'dot ' + (statusOf(w.id)||''); });
}
function drawRail(cur){
  rail.innerHTML = `<span class="mono">Materi</span><button data-go="home" ${cur==='home'?'aria-current="page"':''}><span class="wk">00</span><span class="ttl">Beranda &amp; profil</span><span></span></button>` +
    WEEKS.map(w=>`<button data-go="${w.id}" ${cur===w.id?'aria-current="page"':''}><span class="wk">W${w.n}</span><span class="ttl">${w.title}</span><span class="dot"></span></button>`).join('');

  const a = $('[aria-current]', rail); if(a && window.innerWidth<=860) a.scrollIntoView({inline:'center', block:'nearest'});
}

    <section class="sec"><div class="sec-h"><h2>Profil mata kuliah</h2><span class="mono">Minggu 0</span></div>
      <div class="concept">
        <div class="blk"><h3>Deskripsi</h3><p>Mempelajari tahapan pembangunan perangkat lunak agar produknya memenuhi kriteria kualitas suatu standar: konsep kualitas, model, metrik, standar, serta dasar software testing.</p><p style="color:var(--muted);font-size:.92rem">Rujukan utama: Galin, <i>Software Quality: Concept and Practice</i> (2018); Gordon, <i>Handbook of SQA</i> (2008).</p></div>
        <div class="blk"><h3>Bobot per Sub-CLO</h3><div class="tbl-wrap"><table><thead><tr><th>Sub-CLO</th><th>Fokus</th><th style="text-align:right">Bobot</th></tr></thead><tbody>
          <tr><td class="mono">09-03-01</td><td>Konsep SQA &amp; validasi produk</td><td style="text-align:right">20%</td></tr>
          <tr><td class="mono">09-03-02</td><td>Rencana &amp; strategi pengujian produk</td><td style="text-align:right">25%</td></tr>
          <tr><td class="mono">10-03-01</td><td>Konsep SQA &amp; verifikasi proses</td><td style="text-align:right">25%</td></tr>
          <tr><td class="mono">10-03-02</td><td>Rencana &amp; pengujian proses</td><td style="text-align:right">30%</td></tr></tbody></table></div></div>
        <div class="blk"><h3>Nilai mutu</h3><div class="tbl-wrap"><table><tbody>
          <tr><td>A</td><td>NSM &gt; 85</td><td>BC</td><td>60 &lt; NSM ≤ 65</td></tr><tr><td>AB</td><td>75 &lt; NSM ≤ 85</td><td>C</td><td>50 &lt; NSM ≤ 60</td></tr><tr><td>B</td><td>65 &lt; NSM ≤ 75</td><td>D</td><td>40 &lt; NSM ≤ 50</td></tr><tr><td></td><td></td><td>E</td><td>NSM ≤ 40</td></tr></tbody></table></div></div>
        <div class="blk"><h3>Remedial</h3><p>Diadakan di Minggu 15–16. Syaratnya: rata-rata CLO kurang dari 50, ikut asesmen kognitif, mengerjakan 75% kuis, dan mengumpulkan tugas.</p></div>
      </div></section></div>`;
}
function renderWeek(w){
  const i = WEEKS.indexOf(w), prev = WEEKS[i-1], next = WEEKS[i+1];
  main.innerHTML = `<article class="week">
    <header class="week-head"><p class="eyebrow">Minggu ${w.n} · ${w.tag}</p><h1>${w.title}</h1><p class="lede">${w.lede}</p></header>
    <section class="sec"><div class="sec-h"><h2>Konsep</h2><span class="mono">Ringkasan materi</span></div><div class="concept">${w.concept}</div></section>
    <section class="sec"><div class="sec-h"><h2>Lab interaktif</h2><span class="mono">${w.labs.length} simulasi</span></div><div class="benches">
      ${w.labs.map((l,k)=>`<div class="bench" data-lab="${k}"><div class="bench-head"><span class="mono">Lab ${w.n}.${k+1}</span><h3>${l[1]}</h3><p>${l[2]}</p></div><div class="bench-body"></div></div>`).join('')}</div></section>
    <section class="sec"><div class="sec-h"><h2>Tes interaktif</h2><span class="mono">${w.quiz.length} test case · lulus ≥ 70%</span></div><div data-quiz></div></section>
    <nav class="pager">${prev?`<button class="btn" data-go="${prev.id}">← Minggu ${prev.n}: ${prev.title}</button>`:'<button class="btn" data-go="home">← Beranda</button>'}${next?`<button class="btn pri" data-go="${next.id}">Minggu ${next.n}: ${next.title} →</button>`:'<span></span>'}</nav>
  </article>`;
  w.labs.forEach((l,k) => LABS[l[0]]($(`[data-lab="${k}"] .bench-body`, main)));
  renderQuiz($('[data-quiz]', main), w);
}
function route(){
  const id = (location.hash || '#home').slice(1);
  const w = WEEKS.find(x=>x.id===id);
  drawRail(w ? w.id : 'home');
  w ? renderWeek(w) : renderHome();
  window.scrollTo(0,0);
}
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if(!g) return;
  const t = g.dataset.go; if(('#'+t) === (location.hash||'#home')) { window.scrollTo(0,0); return; }
  location.hash = t;
});
window.addEventListener('hashchange', route);
route();
</script>
